<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charles Zheng :: developer and creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Top bar (modes, style, file actions) / left catalog / 3D canvas / right properties. Phone: catalog becomes a bottom strip, properties a sheet. */
:root{
  --bg:#232323; --panel:#2e2e2e; --panel-2:#3a3a3a; --ink:#dcdcdc; --dim:#9b9b9b; --line:#1c1c1c;
  --accent:#e8892a; --accent-ink:#2a1606; --sel:#4772b3; --vp:#3d3d3d;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
[hidden]{display:none!important}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:232px minmax(0,1fr) 270px;grid-template-areas:"top top top" "cat view props";
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.top{grid-area:top;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{margin:0 8px 0 0;font-size:14px;font-weight:600;letter-spacing:.01em;display:flex;gap:8px;align-items:center}
.top h1 span{font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--dim)}
.seg{display:flex;border:1px solid var(--line);background:var(--panel-2)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg{border-radius:4px;overflow:hidden}
.seg button[aria-pressed="true"]{background:var(--sel);color:#fff}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 11px;font-weight:500}
.btn{border-radius:4px;background:var(--panel-2)}
.btn:hover{background:#474747}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.spacer{flex:1}
select.sty{border:1px solid var(--line);border-radius:4px;background:var(--panel-2);padding:6px 8px}
.cat{grid-area:cat;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px 10px 20px;display:flex;flex-direction:column;gap:14px}
.cat h2{margin:0 0 6px;font-family:var(--f-mono);font-weight:500;font-size:10px;letter-spacing:.14em;color:var(--dim)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tools button,.items button{border:1px solid var(--line);background:var(--panel-2);padding:7px 8px;text-align:left;display:flex;align-items:center;gap:7px;min-width:0}
.tools button,.items button{border-radius:3px}
.tools button[aria-pressed="true"],.items button[aria-pressed="true"]{background:var(--sel);color:#fff;border-color:var(--sel)}
.items{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.items button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:10px;height:10px;flex:none;border:1px solid rgba(0,0,0,.35)}
.view{grid-area:view;position:relative;min-width:0;min-height:0;background:var(--vp)}
.vphead{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:3}
.vphead>*{pointer-events:auto}
.vphead .lab{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--dim);background:rgba(35,35,35,.75);padding:4px 7px;border-radius:3px}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:10px;bottom:10px;right:10px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;align-items:flex-end}
.hud .tip{background:rgba(31,30,27,.82);color:#f4f1ea;padding:6px 10px;font-family:var(--f-mono);font-size:11px;line-height:1.5;max-width:520px}
.hud .coords{background:rgba(46,46,46,.9);color:var(--ink);padding:4px 8px;font-family:var(--f-mono);font-size:11px;font-variant-numeric:tabular-nums}
.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:7px 12px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.clean .top,.clean .cat,.clean .props,.clean .hud,.clean .vphead{display:none!important}
.clean .app{display:block}
.clean .view{position:fixed;inset:0}
.hover{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--ink);padding:4px 8px;font-size:12px;font-weight:500;box-shadow:0 2px 0 rgba(0,0,0,.3);white-space:nowrap}
.vigl{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse 80% 75% at 50% 50%,transparent 50%,rgba(20,12,4,.7) 100%)}
.cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.5);pointer-events:none}
.props{grid-area:props;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
.props h2{margin:0;font-size:15px;font-weight:600}
.props .lab{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--dim);margin-bottom:5px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row .btn{flex:1;min-width:0;padding:6px 6px}
.field{display:flex;flex-direction:column;gap:5px}
.field select,.field input[type=range]{width:100%}
.field select{border:1px solid var(--line);background:var(--panel-2);padding:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.kv b{color:var(--ink);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--dim);line-height:1.55}
.empty kbd,.keys kbd{font-family:var(--f-mono);font-size:10px;border:1px solid var(--line);background:var(--panel-2);padding:1px 4px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;color:var(--dim);font-size:12px}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.list button{border:0;border-bottom:1px solid var(--line);background:none;padding:6px 2px;text-align:left;display:flex;justify-content:space-between;gap:8px}
.list button span:last-child{color:var(--dim);font-family:var(--f-mono);font-size:11px}
.list button[aria-current="true"]{background:var(--panel-2)}
/* walk info card */
.card{position:absolute;right:12px;top:12px;width:min(340px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);box-shadow:0 3px 0 rgba(0,0,0,.2);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card .lab{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--dim)}
.card h3{margin:0;font-size:18px;font-weight:600}
.card p{margin:0;line-height:1.55;color:var(--ink)}
.card .x{align-self:flex-end;border:1px solid var(--line);background:none;width:28px;height:28px;margin-top:-6px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,18,15,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--panel);width:min(620px,100%);max-height:90%;display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line)}
.modal h3{margin:0;font-size:16px}
.modal p{margin:0;color:var(--dim);line-height:1.5}
.modal textarea{width:100%;min-height:260px;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);background:var(--panel-2);padding:8px;resize:vertical}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "view" "cat"}
  .cat{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));gap:12px;max-height:150px}
  .cat section{flex:none}
  .items,.tools{grid-template-columns:repeat(4,110px)}
  .props{position:fixed;left:8px;right:8px;bottom:160px;max-height:45%;border:1px solid var(--line);box-shadow:0 3px 0 rgba(0,0,0,.2);z-index:20}
  .props.idle{display:none}
  .hud .tip{display:none}
}
.top>.seg:has(#m-plan),.top label.sr,#undo,#starter,#clear,#import,#export,.cat,.props,.vphead,.hud .coords{display:none!important}
.app{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:auto minmax(0,1fr)!important;grid-template-areas:"top" "view"!important}
#movegrp{margin-left:auto}
/* Recruiter view: a plain, light portfolio page */
.rec{--ink:#1d1c19;--dim:#6b665a;--line:#d9d2c3;--accent:#c8792e;background:#f6f3ec;color:var(--ink);min-height:100%;font-family:var(--f-ui);
  padding:calc(84px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
.rec .cl{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:52px}
.rec header{display:flex;flex-direction:column;gap:10px}
.rec .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--dim)}
.rec h1{margin:0;font-size:clamp(32px,6vw,56px);line-height:1.03;letter-spacing:-.02em;font-weight:600;text-wrap:balance}
.rec header p{margin:0;font-size:18px;color:var(--dim);max-width:60ch;line-height:1.5}
.rec section{display:grid;grid-template-columns:190px minmax(0,1fr);gap:24px;border-top:1px solid var(--line);padding-top:22px}
.rec .col section{display:block;border-top:0;padding-top:0}
@media (max-width:700px){.rec section{grid-template-columns:minmax(0,1fr);gap:10px}}
.rec h3{margin:0;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.16em;color:var(--dim)}
.rec h3 em{display:block;font-style:normal;color:var(--ink);font-family:var(--f-ui);font-size:20px;letter-spacing:0;margin-top:5px;font-weight:600}
.rec .body{display:flex;flex-direction:column;gap:14px;min-width:0}
.rec .body p{margin:0;line-height:1.6;max-width:62ch}
.rec .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.rec .cards{grid-template-columns:minmax(0,1fr)}}
.rec .cards a,.rec .cards div{border:1px solid var(--line);background:#fffdf7;padding:12px 14px;color:var(--ink);text-decoration:none;display:flex;flex-direction:column;gap:3px;border-radius:6px}
.rec .cards a:hover{border-color:var(--accent)}
.rec .cards b{font-weight:600}
.rec .cards span{font-size:13px;color:var(--dim)}
.rec .cv{max-width:1120px;margin:0 auto;padding:0 40px;display:grid;grid-template-columns:340px 1fr;gap:64px;text-align:left}
.rec .cv aside{position:sticky;top:84px;height:calc(100vh - 124px);padding:0 0 10px;display:flex;flex-direction:column}
.rec .cv aside h1{font:700 40px/1.05 var(--f-ui);letter-spacing:-.03em;margin:0;color:var(--ink)}.rec .cv aside h2{font:500 18px var(--f-ui);margin:8px 0 10px}.rec .cv aside p{color:var(--dim);margin:0 0 30px;max-width:290px}
.rec .cv nav a{display:flex;align-items:center;gap:12px;font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-decoration:none;padding:7px 0}.rec .cv nav a:before{content:'';width:28px;height:1px;background:currentColor}.rec .cv nav a:hover{color:var(--ink)}.rec .cv nav a:hover:before{width:56px}
.rec .cvbtn{align-self:flex-start;margin-top:22px;border:1px solid var(--ink);color:var(--ink);padding:9px 16px;font:500 13px var(--f-mono);text-decoration:none}.rec .cvbtn:hover{background:var(--ink);color:#fff}
.rec .soc{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px 16px;font:12.5px var(--f-mono)}.rec .soc a{color:var(--ink)}
.rec .col{padding:0}.rec .col section{margin-bottom:64px}.rec .col h3{font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0 0 14px}
.rec #cv-about p{font-size:16.5px;color:#3d3a33;margin:0 0 12px;max-width:620px}
.rec .xp{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:14px;margin:0 -14px;border-radius:8px}.rec .xp:hover,.rec .pj:hover{background:#fff}
.rec .when{font:12px/1.9 var(--f-mono);color:var(--dim)}.rec .xp h4,.rec .pj h4{margin:0;font:600 15.5px var(--f-ui);color:var(--ink)}.rec .xp p,.rec .pj p{margin:4px 0 0;color:#57534b;font-size:14.5px}
.rec .pj{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:14px;margin:0 -14px 6px;border-radius:8px}.rec .pj img{width:150px;height:96px;object-fit:cover;object-position:top;border-radius:6px;border:1px solid var(--line)}
.rec .pj .th{width:150px;height:96px;border-radius:6px;background:#1d1c19;color:#ff9a3c;display:flex;align-items:center;justify-content:center;font:500 18px var(--f-mono)}
.rec .pj h4 span{font:400 12px var(--f-mono);color:var(--dim);margin-left:6px}.rec .tg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.rec .tg span{font:12px var(--f-mono);background:#ebe5d8;padding:1px 8px;border-radius:99px}
.rec .ln{margin-top:8px;font:13px var(--f-mono);display:flex;gap:14px}.rec .ln a{color:var(--ink)}
.rec .food p{font-size:15.5px;color:#3d3a33;max-width:620px;margin:0 0 12px}.rec .fill{color:var(--dim);font-style:italic}.rec .motto{font:500 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:22px 0 10px}
.rec .plat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}.rec .plat a{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fff;display:flex;flex-direction:column}
.rec .plat b{font:600 14px var(--f-ui)}.rec .plat span{font:12px var(--f-mono);color:var(--dim)}.rec .newest{font:13px var(--f-mono)!important}
@media(max-width:560px){.rec .plat{grid-template-columns:1fr}}
.rec #cv-built p{color:#57534b;max-width:620px;font-size:14.5px}.rec .col footer{font-size:13px;color:var(--dim)}
@media(max-width:860px){.rec .cv{grid-template-columns:1fr;gap:0;padding:0 18px}.rec .cv aside{position:static;height:auto;padding:40px 0 10px}.rec .soc{margin-top:18px}.rec .col{padding:24px 0}.rec .xp{grid-template-columns:1fr;gap:2px}.rec .pj{grid-template-columns:96px 1fr}.rec .pj img,.rec .pj .th{width:96px;height:72px}}
.rec .ex{align-self:flex-start;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;border:1px dashed var(--dim);color:var(--dim);padding:2px 6px}
.rec footer{font-size:12px;color:var(--dim)}
body.recmode .app{display:none}
body.recmode{overflow:auto}
.top,.recbar,.hud .tip{display:none!important}
.app{grid-template-rows:0 minmax(0,1fr)!important}
.kp{position:absolute;left:16px;bottom:18px;z-index:6;font:12px var(--f-mono);color:#e8e6e1;background:rgba(18,18,20,.82);border:1px solid #2c2c30;border-radius:4px;padding:6px 10px;transition:opacity .6s;pointer-events:none}.kp.off{opacity:0}.kp span{color:#77736c;margin:0 4px}
kbd{font:500 11px var(--f-mono);border:1px solid #4a4a50;border-bottom-width:2px;border-radius:3px;padding:0 5px;margin-right:3px;background:#1e1e22;color:#e8e6e1}
.ms{position:fixed;z-index:45;display:flex;align-items:center;gap:4px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65),0 0 14px rgba(0,0,0,.35)}
.ms button{all:unset;cursor:pointer;font:500 14px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.62);padding:8px 10px;transition:color .15s}
.ms button:hover,.ms button.on{color:#fff}.ms button:focus-visible{outline:2px solid #ff9a3c;outline-offset:2px}
.ms.lite{color:#1d1c19;text-shadow:none}.ms.lite button{color:rgba(29,28,25,.5)}.ms.lite button:hover,.ms.lite button.on{color:#1d1c19}
.ms kbd{background:none;border:0;padding:0;margin:0;color:inherit;opacity:.75;font:500 12px var(--f-mono)}
.ms-tabs{top:12px;left:50%;transform:translateX(-50%);gap:10px}.ms-tabs button{font-size:16px;padding:8px 12px}.ms-tabs button.on{box-shadow:inset 0 -2px 0 #ff9a3c}
.ms-tabs .sh{opacity:.55;font-size:13px}
.ms-prompts{right:18px;bottom:16px;gap:18px}.ms-prompts button{text-transform:none;letter-spacing:0;font-size:13.5px;padding:6px 2px;display:flex;gap:8px;align-items:center}
.ms-prompts kbd{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.18);opacity:1;font-size:11.5px}.ms-prompts button.on kbd{background:#ff9a3c;color:#1b1206;text-shadow:none}
.ms.lite.ms-prompts kbd{background:rgba(0,0,0,.08)}
.ms-camera{left:16px;bottom:54px;gap:6px}.ms-camera button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;font-size:10.5px}
.ms-camera svg{width:26px;height:26px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}.ms.lite.ms-camera svg{filter:none}.ms-camera button.on svg{color:#ff9a3c}
.recbar{position:fixed;z-index:30;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;background:#2e2e2e;border-radius:4px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.recbar button{border:0;background:none;color:#dcdcdc;padding:8px 13px;font-weight:500}
.recbar button[aria-pressed="true"]{background:#4772b3;color:#fff}

/* click hint */
.wx{position:absolute;right:12px;top:12px;z-index:6;background:#121214;color:#e8e6e1;border:1px solid #2c2c30;padding:5px 10px;border-radius:4px;font-family:var(--f-mono);font-size:12px;display:flex;gap:10px;align-items:center;cursor:default;font-variant-numeric:tabular-nums}.wx .m{color:#8f8b84}
.exitz{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:40;background:#121214;color:#e8e6e1;border:1.5px solid #ff9a3c;border-radius:6px;padding:11px 22px;font-family:var(--f-mono);font-size:16px;font-weight:500;display:flex;gap:12px;align-items:center;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.35)}.exitz:hover{background:#1e1e22}.exitz .a{color:#ff9a3c}.exitz .k{font-size:11px;color:#8f8b84;border:1px solid #3a3a40;border-radius:3px;padding:1px 6px}
.hint{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);z-index:6;background:#121214;color:#e8e6e1;border:1px solid #2c2c30;padding:7px 13px 7px 11px;border-radius:4px;font-family:var(--f-mono);font-size:13px;display:flex;gap:9px;align-items:center;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);transition:opacity .4s}
.hint i{flex:none;font-style:normal;color:#ff9a3c;animation:hp 1.6s ease-in-out infinite}.hint .m{color:#8f8b84}
@keyframes hp{0%,100%{opacity:1}50%{opacity:.35}}
.hint.off{opacity:0}
/* monitor view: projects on the screen */
.mon{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:72px 16px 16px;background:rgba(12,12,14,.45);animation:mf .35s ease-out}
@keyframes mf{from{opacity:0}to{opacity:1}}
.mon .win{width:min(980px,100%);max-height:100%;overflow:auto;background:#f7f4ee;color:#1d1c19;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.45);display:flex;flex-direction:column}
.mon .bar{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#1d1d20;color:#cfcfd2;font-family:var(--f-mono);font-size:12px}
.mon .bar b{color:#fff;font-weight:500}
.mon .bar .sp{flex:1}
.mon .bar button{border:0;background:#3a3a3e;color:#fff;border-radius:6px;padding:5px 10px;font-size:12px}
.mon .in{padding:20px;display:flex;flex-direction:column;gap:16px}
.mon .in > p{margin:0;color:#6b665a;max-width:62ch}
.stories{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:12px}

<script>
// startup screen: block bar fills as the room's models load, then fades into the room
(()=>{const el=document.getElementById('boot'),bar=document.getElementById('bootbar'),N=24,TOTAL=4;let got=0,shown=0,done=false;
 if(new URLSearchParams(location.search).get('boot')==='0'){el.remove();window.__bootStep=()=>{};return}
 const draw=p=>{const k=Math.round(p*N);bar.textContent='\u2588'.repeat(k)+'\u2591'.repeat(N-k)+'  '+String(Math.round(p*100)).padStart(3,' ')+'%'};
 const finish=()=>{if(done)return;done=true;draw(1);setTimeout(()=>{el.style.opacity=0;el.style.pointerEvents='none';setTimeout(()=>el.remove(),500)},200)};
 window.__bootStep=()=>{got++;if(got>=TOTAL)finish()};
 const tick=()=>{if(done)return;const target=Math.min(.95,(got/TOTAL)*.9+.08);shown+=(target-shown)*.18;draw(shown);requestAnimationFrame(tick)};draw(0);tick();
 setTimeout(finish,9000)})();
</script>

// ---------------- walls ----------------
function wallById(id){return state.walls.find(w=>w.id===id)}
function buildWalls(){
  while(wallGroup.children.length)wallGroup.remove(wallGroup.children[0]);
  for(const w of state.walls){
    const dx=w.x2-w.x1,dz=w.z2-w.z1,L=Math.hypot(dx,dz);if(L<.05)continue;
    const g=new THREE.Group();g.position.set((w.x1+w.x2)/2,0,(w.z1+w.z2)/2);g.rotation.y=-Math.atan2(dz,dx);g.userData.wallId=w.id;
    const box=(len,h,y,mat,x=0,d=.12)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(len,h,d),mat);m.position.set(x,y+h/2,0);m.castShadow=m.receiveShadow=true;m.userData.wallId=w.id;g.add(m);return m};
    const ST0=STYLES[state.style]||{};const trim=ST0.trim?PH(new THREE.Color(ST0.trim).getHex(),70):M(0xf3efe4);
    if(ST0.cap)box(L+.12,.025,H,W(new THREE.Color(ST0.cap).getHex()),0,.13);
    const ST=STYLES[state.style]||{};if(ST.wains&&(w.kind==='wall'||w.kind==='window')){box(L+.12,w.kind==='window'?.9:1.0,0,PH(new THREE.Color(ST.wains).getHex(),30),0,.15);if(w.kind==='wall'){box(L+.12,.06,.93,PH(new THREE.Color(ST.stripe).getHex(),40),0,.16);box(L+.12,.04,1.0,PH(0x55606e,40),0,.19)}}
    if(w.kind==='woodwall'){box(L+.12,H,0,WV(0xd9b48a,Math.max(1,Math.round(L/1.2))));box(L+.12,.1,0,trim,0,.15);box(L+.12,.04,H-.04,trim,0,.14)}
    if((w.kind==='wall'||w.kind==='window')&&!ST0.cap){box(L+.12,.16,H-.16,wallMat,0,.3);box(L+.12,.03,H-.19,M(0x8a7a62),0,.31)}
    if(w.kind==='wall'){box(L+.12,H,0,wallMat);box(L+.12,.1,0,trim,0,.15)}
    else if(w.kind==='window'){box(L,.9,0,wallMat);box(L,.5,2.1,wallMat);box(L,.1,0,trim,0,.15);box(L,.04,.9,trim,0,.2);
      const gl=new THREE.Mesh(new THREE.PlaneGeometry(L-.08,1.18),new THREE.MeshBasicMaterial({color:0xdfeaf2,transparent:true,opacity:.1,depthWrite:false}));gl.position.set(0,1.5,0);gl.userData.wallId=w.id;g.add(gl);const gl2=gl.clone();gl2.rotation.y=Math.PI;g.add(gl2);
      [[-L/2+.03],[L/2-.03],[0]].forEach(([x])=>box(.04,1.2,.9,trim,x,.14));box(L,.04,1.5,trim,0,.14)}
    else{ // door or front door (opening)
      box(L,.5,2.1,wallMat);[-L/2+.03,L/2-.03].forEach(x=>box(.06,2.1,0,trim,x,.16));box(L,.06,2.07,trim,0,.16);
      const leafW=Math.min(.92,L-.08);const leaf=new THREE.Group();leaf.position.set(-L/2+.05,0,.06);leaf.rotation.y=w.kind==='front'?0:-1.2;
      const lm=new THREE.Mesh(new THREE.BoxGeometry(leafW,2.04,.04),(w.kind==='front'?PH(0x2b2d34,30):M(0xf3efe8)));lm.position.set(leafW/2,1.02,0);lm.castShadow=true;lm.userData.wallId=w.id;leaf.add(lm);
      const kn=new THREE.Mesh(new THREE.SphereGeometry(.03,8,6),M(0xc9c9c9));kn.position.set(leafW-.08,1.0,.04);leaf.add(kn);g.add(leaf);
      if(w.kind==='front'){const mat=new THREE.Mesh(new THREE.PlaneGeometry(Math.min(1,L),.55),M(0x6a5a44));mat.rotation.x=-Math.PI/2;mat.position.set(0,.007,.45);g.add(mat)}}
    wallGroup.add(g);
  }
}
const segDist=(px,pz,w)=>{const dx=w.x2-w.x1,dz=w.z2-w.z1,L2=dx*dx+dz*dz||1;let t=((px-w.x1)*dx+(pz-w.z1)*dz)/L2;t=Math.max(0,Math.min(1,t));const x=w.x1+t*dx,z=w.z1+t*dz;return {d:Math.hypot(px-x,pz-z),x,z,t}};
// cut an opening out of collinear plain walls
function carve(o){
  const dx=o.x2-o.x1,dz=o.z2-o.z1,L=Math.hypot(dx,dz),ux=dx/L,uz=dz/L;const out=[];
  for(const w of state.walls){
    if(w.kind!=='wall'&&w.kind!=='woodwall'){out.push(w);continue}
    const cr1=(w.x1-o.x1)*uz-(w.z1-o.z1)*ux,cr2=(w.x2-o.x1)*uz-(w.z2-o.z1)*ux;
    if(Math.abs(cr1)>.05||Math.abs(cr2)>.05){out.push(w);continue}
    let a=(w.x1-o.x1)*ux+(w.z1-o.z1)*uz,b=(w.x2-o.x1)*ux+(w.z2-o.z1)*uz;const flip=a>b;if(flip)[a,b]=[b,a];
    if(b<=.001||a>=L-.001){out.push(w);continue}
    const P=t=>[+(o.x1+ux*t).toFixed(3),+(o.z1+uz*t).toFixed(3)];
    if(a<0){const [x1,z1]=P(a),[x2,z2]=P(0);out.push({id:state.next++,kind:'wall',x1,z1,x2,z2})}
    if(b>L){const [x1,z1]=P(L),[x2,z2]=P(b);out.push({id:state.next++,kind:'wall',x1,z1,x2,z2})}
  }
  state.walls=out;
}

function surfaceAt(x,z,ignoreId){let top=0;for(const it of state.items){if(it.id===ignoreId)continue;const T=TYPES[it.t];if(!T.surface)continue;const c=Math.cos(-it.ry),s=Math.sin(-it.ry);const lx=(x-it.x)*c-(z-it.z)*s,lz=(x-it.x)*s+(z-it.z)*c;if(Math.abs(lx)<=T.w/2&&Math.abs(lz)<=T.d/2)top=Math.max(top,T.surface+(it.lift||0))}return top}
function itemY(it){const T=TYPES[it.t];if(T.kind==='wall')return (T.y||1.5)+(it.lift||0);if(T.kind==='ceil')return H-.005;if(T.kind==='top')return surfaceAt(it.x,it.z,it.id)+(it.lift||0);return it.lift||0}
function buildItem(it){const T=TYPES[it.t];const g=new THREE.Group();T.b(g);g.traverse(o=>{o.userData.itemId=it.id;if(o.isPointLight){o.castShadow=false}});g.userData.itemId=it.id;itemGroup.add(g);nodes[it.id]=g;placeNode(it);return g}
function ceilFade(){for(const it of state.items){if(TYPES[it.t].kind!=='ceil'||!nodes[it.id])continue;nodes[it.id].traverse(o=>{if(o.isMesh){o.material.transparent=true;o.material.opacity=mode==='walk'?1:.3}})}}
function placeNode(it){const g=nodes[it.id];if(!g)return;g.position.set(it.x,itemY(it),it.z);g.rotation.y=it.ry}
function rebuildItems(){for(const id in nodes){itemGroup.remove(nodes[id]);delete nodes[id]}animated.length=0;state.items.forEach(buildItem);ceilFade()}
function relayoutTops(){state.items.forEach(placeNode)}
function addItem(t,x,z,ry=0,extra={}){const it=Object.assign({id:state.next++,t,x:+x.toFixed(3),z:+z.toFixed(3),ry,tag:TYPES[t].tag||''},extra);state.items.push(it);buildItem(it);return it}
function wallSnap(x,z){let best=null;for(const w of state.walls){const r=segDist(x,z,w);if(!best||r.d<best.r.d)best={r,w}}if(!best||best.r.d>.9)return null;
  const w=best.w,dx=w.x2-w.x1,dz=w.z2-w.z1,L=Math.hypot(dx,dz);let nx=-dz/L,nz=dx/L;if((x-best.r.x)*nx+(z-best.r.z)*nz<0){nx=-nx;nz=-nz}
  return {x:best.r.x+nx*.065,z:best.r.z+nz*.065,ry:Math.atan2(nx,nz)}}

const norm=a=>{a=a%(Math.PI*2);if(a>Math.PI)a-=Math.PI*2;if(a<-Math.PI)a+=Math.PI*2;return +a.toFixed(4)};

  orbit:'Drag to orbit, right-drag to pan, scroll to zoom. Click an object to select it.',walk:moveMode==='keys'?'WASD mode: W A S D to walk, Shift to jog, drag to look. Click a chair to sit, or an object to open it.':'Click mode: click the floor to walk there (you go around furniture), drag to look. Click a chair to sit.'}[mode];$('tip').textContent=t||''}

function setMode(m){mode=m;['plan','orbit','walk'].forEach(k=>$('m-'+k).setAttribute('aria-pressed',k===m));
  cam=m==='plan'?ortho:persp;controls.enabled=m==='orbit';ceiling.visible=m==='walk';grid.visible=border.visible=m!=='walk';helperGroup.visible=m!=='walk';$('cross').hidden=m!=='walk';$('card').hidden=true;
  if(ghost)ghost.visible=m==='plan';
  $('movegrp').hidden=m!=='walk';target.visible=false;
  ceilFade();
  if(m==='orbit'){const b=bounds();controls.target.set(b.cx,0,b.cz);persp.position.set(b.cx+b.size*.35,Math.max(8,b.size*1.5),b.cz+Math.max(5,b.size*.75));persp.fov=50;persp.updateProjectionMatrix();controls.update()}

function showPoker(){sheet(`<article class="paper" role="dialog" aria-label="Poker solver and trainer"><button class="px" data-close aria-label="Close">×</button>
 <h1>A from-scratch poker solver, and a trainer that grades every decision against it</h1>
 <div class="bt"><a href="https://pokerlab.duckdns.org" target="_blank" rel="noopener">Live demo</a><a href="https://github.com/charleszheng0/pokercfrgpu" target="_blank" rel="noopener">Code</a></div>
 <figure><img src="img/poker-solver.jpg" alt="The solver page: a river spot, the exploitability bar, and the strategy as a grid of hands" loading="lazy"><figcaption><b>The solver.</b> A river spot, solved in 0.1 s. Each cell of the grid is a starting hand, coloured by how often it checks or bets.</figcaption></figure>
 <h2>Abstract</h2><p>Solver apps show you the right play, but not how they got there. I wanted to know, so I wrote one. It is a heads-up no-limit hold'em solver in C++ (Discounted CFR, suit symmetry, 8 threads), plus a CUDA version of the same algorithm. A batch run produced 14,971 solves in 8.6 hours on a laptop. Every stored answer is within 0.5% of the pot of perfect play. Against open-source TexasSolver, the biggest strategy gap at 0.05% exploitability is 0.4 points, and river and turn solves are 1.7–2× faster at the same accuracy.</p>
 <figure><img src="img/poker-trainer.jpg" alt="The trainer grading a fold as a blunder, with EV loss and how often the solver takes each action" loading="lazy"><figcaption><b>The trainer.</b> It deals one of 330,578 solved spots. Right after you act, it shows what your choice cost and how often perfect play takes each action.</figcaption></figure>
 <h2>Results</h2><table><tr><th>Spot</th><th>Laptop (M2, 8 threads)</th><th>GPU (T4)</th><th>Speedup</th></tr>
 <tr><td>Turn</td><td>26.0 s</td><td>4.79 s</td><td><b>5.4×</b></td></tr><tr><td>Flop, 3-bet pot</td><td>39.6 s</td><td>5.01 s</td><td><b>7.9×</b></td></tr><tr><td>Flop, single-raised pot</td><td>1,588 s</td><td>138.4 s</td><td><b>11.5×</b></td></tr></table>
 <p class="note">Same spot, same target, same iterations. The laptop swapped 6.4 GB on the last row, so part of that speedup is memory, not compute.</p>
 <h2>How it was made</h2><ol><li>River solver first, checked against TexasSolver before building on top of it.</li><li>Turn, with suit symmetry: 27% less work for exactly the same answer.</li><li>A batch pipeline with an accuracy gate. 14,971 solves, 0 rejected.</li><li>The trainer. Loading a random spot went from 20 s to about 3 ms.</li><li>A CUDA port. Profiling showed 89% of GPU time in two kernels; spreading their work cut a test run from 4.79 s to 1.13 s.</li></ol>
 <h2>Limitations</h2><p>The ranges are hand-built, not a real preflop equilibrium. Bet sizes are limited to 33%, 75%, a 60% raise and all-in. Nobody but me has used the trainer yet, so there is no number for whether it makes players better.</p></article>`,'sheet-paper','Poker solver and trainer')}
